version: '3.8'

services:
  arca:
    build:
      context: .
      dockerfile: Dockerfile
    image: arca-api-tordini:latest
    container_name: arca-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - ARCA_ENV=${ARCA_ENV:-homologacion}
      - CERTS_DIR=/app/certs
      - ARCA_HTTP_HOST=0.0.0.0
      - ARCA_HTTP_PORT=3001
      - ARCA_HTTP_CORS_ORIGINS=${ARCA_HTTP_CORS_ORIGINS:-}
      - ARCA_JWT_SECRET=${ARCA_JWT_SECRET:?ARCA_JWT_SECRET is required}
      - ARCA_LOG_LEVEL=${ARCA_LOG_LEVEL:-info}
      - ARCA_PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    volumes:
      # Montar certs como read-only desde el host
      - ./certs:/app/certs:ro
      # Opcional: persistir el TA cacheado entre reinicios
      - arca-data:/app/certs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  arca-data:
    driver: local
